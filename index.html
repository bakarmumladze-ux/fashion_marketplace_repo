<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Marketplace</title>
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <header>

        <nav class="d-flex ai-center jc-sb">
            <a href="index.html">
                <h2>Logo</h2>
            </a>
            <div class="search">
                <img src="./assets/images/search.svg" alt="Search image">
                <input type="search" placeholder="Search Items, Fashion, Collection and Users">
            </div class="input-search">
            <ul class="d-flex">
                <li><a href="#">Home</a></li>
                <li><a href="#">Explore <img src="assets/images/arrow.svg" alt="arrow down"></a></li>
                <li><a href="#">Personal Collection</a></li>
                <li><a href="#">Drops</a></li>
                <li><a href="#">More <img src="assets/images/arrow.svg" alt="arrow down"></a></li>
            </ul>

            <div class=" personal-bnts d-flex">
                <div class="social-btns d-flex gap-twenty">
                    <img src="./assets/images/bell.svg" alt="Notification bell" class="bell">
                    <img src="./assets/images/message.svg" alt="Message icon" class="message">
                </div>

                <button class="wallet">Wallet</button>
                <div class="profile-btns d-flex">
                    <div class="profile-btns d-flex">
                        <img src="./assets/images/rectangle.svg" alt="upside down rectangle btn" class="rectangle">
                        <img src="./assets/images/person.svg" alt="person icon">

                    </div>

                </div>
            </div>
        </nav>

        <div class="two-main-btns d-flex j-center">
            <div class="collection-market d-flex">
                <button class="collection-btn button-padding left-btn">Main Collection</button>
                <button class="market-btn button-padding right-btn">Creators Market</button>
            </div>
        </div>
    </header>
    <main>
        <section class="clothes-exploration ">
            <article class="fashion-article">
                <h2 class="clothes-h2">Clothes are the
                    Spirit of Fashion</h2>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nunc vulputate libero et velit.</p>
                <div class="article-btns d-flex">
                    <button class="explore-btn">Explore Now</button>
                    <button class="create-btn">Create</button>
                </div>
                <div class="stats d-flex"">
                    <div class="data-div" >
                        <h3>100+</h3>
                        <p>Brands</p>
                    </div>
                    <div class="data-div">
                        <h3>20k+</h3>
                        <p>Fashion Designer</p>
                    </div>
                    <div class="data-div">
                        <h3>60+</h3>
                        <p>Fashion Shows</p>
                    </div>

                </div>
            </article>


            <div class="collection-photos">

            </div>
        </section>

    </main>
    <footer></footer>
</body>

</html>
